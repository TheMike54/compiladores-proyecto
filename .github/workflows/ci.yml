name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas
        # Mientras no haya pruebas, unittest sale con código 5; eso no debe bloquear los primeros PR.
        run: |
          set +e
          python -m unittest discover -s tests -t . -v
          code=$?
          if [ "$code" -eq 5 ]; then echo "Sin pruebas todavía"; exit 0; fi
          exit $code
